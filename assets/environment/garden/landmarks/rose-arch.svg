<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170">
  <!-- Садовая арка-пергола в розах: ориентир на горизонте. Цвета: docs/visual-bible.md §6. -->
  <g stroke="#4A3428" stroke-width="2" stroke-linejoin="round">
    <!-- столбы -->
    <rect x="34" y="40" width="18" height="128" rx="2" fill="#BF7A45"/>
    <rect x="148" y="40" width="18" height="128" rx="2" fill="#BF7A45"/>
