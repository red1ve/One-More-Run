    <circle cx="118" cy="28" r="1.8"/><circle cx="156" cy="30" r="2"/><circle cx="38" cy="62" r="1.6"/>
    <circle cx="60" cy="38" r="1.8"/><circle cx="96" cy="30" r="1.6"/><circle cx="138" cy="36" r="1.6"/>
