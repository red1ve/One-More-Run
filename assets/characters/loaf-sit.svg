<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <!-- Loaf сидит (вид «Sit / Game Over», docs/visual-bible.md §2): сетка 10×12, 1 единица = 30.
       Фронтальный вид: анатомически левое (полное) ухо и рыжее пятно — справа от зрителя,
       мягко сложенное правое ухо — слева. Тень — одно пятно на земле, без копии кота. -->
  <defs>
    <clipPath id="loaf-head">
      <path d="M40 132 C40 58 94 34 150 34 C206 34 260 58 260 132 C260 184 222 212 150 212 C78 212 40 184 40 132 Z"/>
    </clipPath>
    <clipPath id="loaf-body">
      <path d="M78 206 C62 244 50 294 68 318 L232 318 C250 294 238 244 222 206 Z"/>
    </clipPath>
  </defs>

  <!-- тень на земле -->
  <ellipse cx="160" cy="330" rx="118" ry="16" fill="#C4A97A" opacity="0.55"/>

  <g stroke="#4A3428" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- хвост-плюмаж лежит справа, три крупных «зубца» -->
    <path data-part="tail" d="M214 318 C230 338 270 340 282 316 C292 296 282 270 264 262 C256 274 262 284 252 292
             C244 298 232 296 226 304 C222 310 218 314 214 318 Z" fill="#E39A4F"/>
    <!-- тело: короткая «буханка», без шеи -->
    <path data-part="body" d="M78 206 C62 244 50 294 68 318 L232 318 C250 294 238 244 222 206 Z" fill="#F6E7C8"/>
  </g>
  <!-- тень тела (свет сверху-слева): одна плоская заливка ShadowDust -->
  <g clip-path="url(#loaf-body)">
    <path d="M198 206 C218 244 222 292 206 320 L256 320 L256 206 Z" fill="#C4A97A" opacity="0.45"/>
  </g>
  <g stroke="#4A3428" stroke-width="9" stroke-linejoin="round">
    <!-- лапки -->
    <rect data-part="paw" x="94" y="292" width="46" height="32" rx="15" fill="#F6E7C8"/>
    <rect data-part="paw" x="160" y="292" width="46" height="32" rx="15" fill="#F6E7C8"/>
    <!-- мягко сложенное правое ухо (слева от зрителя): кончик плавно загнут внутрь -->
    <path data-part="earFolded" d="M46 84 C48 60 54 38 64 28 C70 22 78 24 82 32 C92 44 102 56 110 66 Z" fill="#F6E7C8"/>
    <!-- полное левое ухо (справа от зрителя), выше правого -->
    <path data-part="earFull" d="M190 64 C204 46 216 26 226 14 C232 8 240 12 242 20 C248 42 254 62 256 86 Z" fill="#F6E7C8"/>
  </g>
  <!-- внутренняя сторона ушей: CatGinger приглушённо -->
  <path data-part="inner" d="M60 70 C62 54 66 42 72 38 C80 46 88 56 94 64 Z" fill="#E39A4F" opacity="0.5"/>
  <path data-part="inner" d="M206 62 C214 48 222 36 229 28 C234 42 238 56 240 72 Z" fill="#E39A4F" opacity="0.5"/>

  <!-- голова: самая крупная масса, перекрывает тело -->
  <path data-part="head" d="M40 132 C40 58 94 34 150 34 C206 34 260 58 260 132 C260 184 222 212 150 212 C78 212 40 184 40 132 Z"
        fill="#F6E7C8" stroke="#4A3428" stroke-width="9" stroke-linejoin="round"/>
  <!-- рыжее пятно: анатомически левая макушка и глаз (справа от зрителя) -->
  <g clip-path="url(#loaf-head)">
    <path data-part="patch" d="M168 30 C214 26 262 50 266 96 C270 134 250 158 222 160 C198 162 180 150 174 130
             C168 110 152 96 150 72 C149 52 156 36 168 30 Z" fill="#E39A4F"/>
  </g>
  <!-- контур головы поверх пятна -->
  <path d="M40 132 C40 58 94 34 150 34 C206 34 260 58 260 132 C260 184 222 212 150 212 C78 212 40 184 40 132 Z"
        fill="none" stroke="#4A3428" stroke-width="9" stroke-linejoin="round"/>

  <!-- лицо: глаза-точки, встревоженные брови (внутренние концы выше), нос, маленький рот -->
  <g fill="#4A3428">
    <circle cx="110" cy="128" r="8"/>
    <circle cx="190" cy="128" r="8"/>
  </g>
  <g stroke="#4A3428" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M94 109 L124 102"/>
    <path d="M176 102 L206 109"/>
    <path d="M150 162 L150 168 M150 168 L143 174 M150 168 L157 174"/>
  </g>
  <path data-part="nose" d="M141 150 L159 150 L150 161 Z" fill="#E39A4F" stroke="#4A3428" stroke-width="3" stroke-linejoin="round"/>
</svg>
